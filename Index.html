<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color System Designer | Raw Variables</title>
    <link rel="stylesheet" href="Styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <app>
      <header>
        <span style="display: flex; align-items: center; gap: 12px">
          <button
            id="toggleSidebarBtn"
            class="btn btn--secondary"
            style="
              padding: 0;
              height: 32px;
              width: 32px;
              border-radius: 6px;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 1.2rem;
              background: var(--bg-panel);
              color: var(--text-primary);
              border: 1px solid var(--border-light);
              transition: background-color 0.2s ease;
            "
          >
            ☰
          </button>
          <h2 class="main-header__title" style="margin: 0; line-height: 1">Rahil's Color System Manager</h2>
        </span>
        <span id="mainActionBtns"></span>
      </header>

      <aside class="sidebar-content custom-scrollbar" id="colorInputs"></aside>

      <main class="main-body custom-scrollbar">
        <div class="tabs-navigation">
          <button class="tab-btn active" data-target="panel-raw">Raw Colors</button>
          <button class="tab-btn" data-target="panel-light">Light Theme</button>
          <button class="tab-btn" data-target="panel-dark">Dark Theme</button>
        </div>
        <div id="rawColorsContainer" class="tabs-content-container"></div>
      </main>
    </app>
    <script src="JS/Utils.js"></script>
    <script src="JS/UiGen.js"></script>
    <script src="JS/DocGen.js"></script>
    <script src="JS/ClrGen.js"></script>

    <script>
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeColorControls);
      } else {
        initializeColorControls();
      }
    </script>
  </body>
</html>
